workflows:
  android-debug-apk:
    name: LYMIX Android Debug APK
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Locate and unpack Lymix project
        script: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf source
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          test -f source/Lymix/pubspec.yaml

      - name: Check Flutter installation
        script: |
          flutter --version
          dart --version
          java -version

      - name
