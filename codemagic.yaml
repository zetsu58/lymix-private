workflows:
  android-debug-apk:
    name: LYMIX Android Debug APK
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Locate and unpack Lymix project
        script: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf source
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          test -f source/Lymix/pubspec.yaml

      - name: Check Flutter installation
        script: |
          flutter --version
          dart --version
          java -version

      - name: Complete Android scaffold
        script: |
          set -e
          cd source/Lymix

          flutter create \
            --no-pub \
            --platforms=android \
            --org com.lymix \
            --project-name lymix \
            .

      - name: Force compatible Android toolchain
        script: |
          set -e
          cd source/Lymix

          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle")
          s = settings.read_text()

          s = re.sub(
              r'id\s+"com\.android\.application"\s+version\s+"[^"]+"',
              'id "com.android.application" version "8.7.3"',
              s
          )

          settings.write_text(s)

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          wrapper.parent.mkdir(parents=True, exist_ok=True)

          wrapper.write_text(
              "distributionBase=GRADLE_USER_HOME\n"
              "distributionPath=wrapper/dists\n"
              "zipStoreBase=GRADLE_USER_HOME\n"
              "zipStorePath=wrapper/dists\n"
              "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip\n"
          )

          props = Path("android/gradle.properties")
          p = props.read_text() if props.exists() else ""

          lines = [
              line for line in p.splitlines()
              if not line.startswith("android.newDsl=")
              and not line.startswith("android.builtInKotlin=")
          ]

          props.write_text("\n".join(lines) + "\n")

          print("=== settings.gradle ===")
          print(settings.read_text())

          print("=== gradle-wrapper.properties ===")
          print(wrapper.read_text())
          PY

      - name: Fix Agora dependency
        script: |
          set -e
          cd source/Lymix

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          s = p.read_text()

          s2, n = re.subn(
              r'(?m)^(\s*agora_rtc_engine\s*:\s*)[^\n#]+',
              r'\g<1>^6.5.4',
              s
          )

          if n:
              p.write_text(s2)
              print("agora_rtc_engine pinned to ^6.5.4")
          else:
              print("Agora dependency unchanged.")
          PY

      - name: Flutter pub get
        script: |
          set -e
          cd source/Lymix
          flutter clean
          flutter pub get

      - name: Verify Android versions
        script: |
          set -e
          cd source/Lymix

          echo "=== AGP ==="
          grep -n "com.android.application" android/settings.gradle

          echo "=== Gradle ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

          echo "=== Java ==="
          java -version

      - name: Analyze Dart
        script: |
          cd source/Lymix
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build debug APK
        script: |
          set -e
          cd source/Lymix
          flutter build apk --debug

    artifacts:
      - source/Lymix/build/app/outputs/flutter-apk/*.apk
      - source/Lymix/build/**/outputs/apk/**/*.apk
