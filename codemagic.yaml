workflows:
  android-debug-apk:
    name: LYMIX V20.7 Hardened Android Debug APK
    max_build_duration: 60

    environment:
      flutter: 3.44.7
      java: 17

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches

    scripts:
      - name: Locate and unpack Lymix V20.7 package
        script: |
          set -euo pipefail

          echo "=== Repository root ==="
          ls -lah

          ZIP_FILE="$(find . -maxdepth 1 -type f \
            \( -iname 'LYMIX_V20_7*.zip' -o -iname '*V20_7*.zip' -o -iname '*V20.7*.zip' \) \
            -print | sort | head -n 1)"

          if [ -z "${ZIP_FILE:-}" ]; then
            echo "ERROR: No V20.7 ZIP found in repository root."
            echo "ZIP files currently present:"
            find . -maxdepth 1 -type f -iname '*.zip' -print || true
            exit 1
          fi

          MATCH_COUNT="$(find . -maxdepth 1 -type f \
            \( -iname 'LYMIX_V20_7*.zip' -o -iname '*V20_7*.zip' -o -iname '*V20.7*.zip' \) \
            -print | wc -l | tr -d ' ')"

          if [ "$MATCH_COUNT" -gt 1 ]; then
            echo "ERROR: More than one V20.7 ZIP found."
            find . -maxdepth 1 -type f \
              \( -iname 'LYMIX_V20_7*.zip' -o -iname '*V20_7*.zip' -o -iname '*V20.7*.zip' \) \
              -print
            exit 1
          fi

          echo "Using package: $ZIP_FILE"
          unzip -tq "$ZIP_FILE"

          rm -rf source
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          test -f source/Lymix/pubspec.yaml
          test -f source/Lymix/lib/main.dart

          FOUND_VERSION="$(awk '/^version:/ {print $2; exit}' source/Lymix/pubspec.yaml)"
          echo "Detected Lymix version: $FOUND_VERSION"

          if [ "$FOUND_VERSION" != "20.7.0+207" ]; then
            echo "ERROR: Expected version 20.7.0+207 but found $FOUND_VERSION"
            exit 1
          fi

      - name: Verify pinned toolchain
        script: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version
          flutter doctor -v

      - name: Generate Android scaffold for pinned Flutter
        script: |
          set -euo pipefail
          cd source/Lymix

          rm -rf /tmp/lymix_android_backup /tmp/lymix_scaffold
          mkdir -p /tmp/lymix_android_backup

          cp android/app/src/main/AndroidManifest.xml /tmp/lymix_android_backup/AndroidManifest.xml
          cp -R android/app/src/main/res /tmp/lymix_android_backup/res

          flutter create \
            --no-pub \
            --platforms=android \
            --org com.lymix \
            --project-name lymix \
            /tmp/lymix_scaffold

          rm -rf android
          cp -R /tmp/lymix_scaffold/android ./android

          cp /tmp/lymix_android_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/res
          cp -R /tmp/lymix_android_backup/res android/app/src/main/res

      - name: Set Lymix Android identity
        script: |
          set -euo pipefail
          cd source/Lymix

          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          build_file = next((p for p in candidates if p.exists()), None)
          if build_file is None:
              raise SystemExit("Android app Gradle file not found")

          s = build_file.read_text()
          s = re.sub(r'namespace\s*=\s*["\'][^"\']+["\']', 'namespace = "com.lymix.app"', s)
          s = re.sub(r'namespace\s+["\'][^"\']+["\']', 'namespace "com.lymix.app"', s)
          s = re.sub(r'applicationId\s*=\s*["\'][^"\']+["\']', 'applicationId = "com.lymix.app"', s)
          s = re.sub(r'applicationId\s+["\'][^"\']+["\']', 'applicationId "com.lymix.app"', s)
          build_file.write_text(s)

          root = Path("android/app/src/main/kotlin")
          if root.exists():
              for f in root.rglob("MainActivity.kt"):
                  f.unlink()

          target = root / "com/lymix/app/MainActivity.kt"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              "package com.lymix.app\n\n"
              "import io.flutter.embedding.android.FlutterActivity\n\n"
              "class MainActivity : FlutterActivity()\n"
          )
          PY

      - name: Resolve and freeze Flutter dependencies
        script: |
          set -euo pipefail
          cd source/Lymix

          echo "=== Direct dependency pins ==="
          grep -E '^  [a-zA-Z0-9_]+:' pubspec.yaml || true

          grep -E '^  agora_rtc_engine: 6\.5\.4$' pubspec.yaml
          grep -E '^  flutter_secure_storage: 9\.2\.2$' pubspec.yaml
          grep -E '^  file_picker: 8\.1\.7$' pubspec.yaml
          grep -E '^  http: 1\.6\.0$' pubspec.yaml

          flutter pub get
          test -f pubspec.lock

          flutter pub deps --style=compact > dependency-tree.txt
          echo "Dependency resolution successful."

      - name: Harden Android compileSdk for app and Agora
        script: |
          set -euo pipefail
          cd source/Lymix

          echo "=== Force app compileSdk 36 ==="
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]
          build_file = next((p for p in candidates if p.exists()), None)
          if build_file is None:
              raise SystemExit("Android app Gradle file not found")

          s = build_file.read_text()

          # Kotlin DSL
          s = re.sub(r'compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)', 'compileSdk = 36', s)
          # Groovy DSL
          s = re.sub(r'compileSdkVersion\s+(?:flutter\.compileSdkVersion|\d+)', 'compileSdkVersion 36', s)
          s = re.sub(r'compileSdk\s+(?:flutter\.compileSdkVersion|\d+)', 'compileSdk 36', s)

          build_file.write_text(s)
          print(build_file.read_text())
          PY

          echo "=== Locate Agora 6.5.4 plugin ==="
          PUB_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"
          AGORA_DIR="$(find "$PUB_ROOT" -type d -name 'agora_rtc_engine-6.5.4' -print | head -n 1)"

          if [ -z "${AGORA_DIR:-}" ]; then
            echo "ERROR: agora_rtc_engine-6.5.4 not found in Pub cache"
            find "$PUB_ROOT" -maxdepth 5 -type d -name 'agora_rtc_engine-*' -print || true
            exit 1
          fi

          echo "Agora plugin: $AGORA_DIR"

          python3 - "$AGORA_DIR" <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])
          candidates = [
              root / "android/build.gradle",
              root / "android/build.gradle.kts",
          ]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Agora Android Gradle file not found")

          s = gradle.read_text()
          original = s

          # Common Agora/Groovy forms.
          s = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', s)
          s = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', s)
          # Newer DSL forms if present.
          s = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', s)
          s = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', s)

          if s == original and not re.search(r'(compileSdkVersion|compileSdk).*36', s):
              raise SystemExit("Could not identify Agora compileSdk declaration")

          gradle.write_text(s)
          print("Patched:", gradle)
          print(gradle.read_text())
          PY

          echo "=== Verify compileSdk declarations ==="
          grep -R -E 'compileSdk(Version)?[ =]+36' android/app/build.gradle* || true
          grep -R -E 'compileSdk(Version)?[ =]+36' "$AGORA_DIR/android"/build.gradle* || true

          if ! grep -R -E 'compileSdk(Version)?[ =]+36' "$AGORA_DIR/android"/build.gradle* >/dev/null; then
            echo "ERROR: Agora compileSdk was not patched to 36"
            exit 1
          fi

      - name: Validate Dart compile surface
        script: |
          set -euo pipefail
          cd source/Lymix

          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyzer-output.txt
          ANALYZE_EXIT=${PIPESTATUS[0]}
          set -e

          echo "Analyzer exit code: $ANALYZE_EXIT"

          if grep -E '^[[:space:]]*error[[:space:]]+•' analyzer-output.txt >/dev/null; then
            echo "Real analyzer errors found:"
            grep -E '^[[:space:]]*error[[:space:]]+•' analyzer-output.txt
            exit 1
          fi

          echo "No Dart analyzer errors."

      - name: Compile tests
        script: |
          set -euo pipefail
          cd source/Lymix

          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test --no-pub --reporter expanded 2>&1 | tee test-output.txt
          else
            echo "No tests found." | tee test-output.txt
          fi

      - name: Verify Android manifest and resources
        script: |
          set -euo pipefail
          cd source/Lymix

          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -f "android/app/src/main/res/mipmap-$d/ic_launcher.png"
          done

          echo "Manifest and launcher resources verified."

      - name: Warm Gradle with retry
        script: |
          set -euo pipefail
          cd source/Lymix/android
          chmod +x gradlew

          for attempt in 1 2 3 4; do
            echo "Gradle attempt $attempt/4"
            if ./gradlew --version; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            rm -rf "$HOME/.gradle/wrapper/dists"/*
            sleep 10
          done

      - name: Build debug APK
        script: |
          set -euo pipefail
          cd source/Lymix

          flutter build apk --debug --no-pub

          test -s build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

    artifacts:
      - source/Lymix/build/app/outputs/flutter-apk/*.apk
      - source/Lymix/analyzer-output.txt
      - source/Lymix/test-output.txt
      - source/Lymix/dependency-tree.txt
      - source/Lymix/pubspec.lock
