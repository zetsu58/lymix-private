workflows:
  android-debug-apk:
    name: LYMIX Android Debug APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Unpack Flutter project
        script: |
          rm -rf source
          mkdir -p source
          unzip -q Lymix_V8_16_GITHUB_UPLOAD_LITE_DENO_READY.zip -d source
      - name: Complete Android scaffold
        script: |
          cd source/Lymix
          flutter create --no-pub --platforms=android --org com.lymix --project-name lymix .
      - name: Fix dependency compatibility
        script: |
          cd source/Lymix
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('pubspec.yaml')
          s = p.read_text()
          s2, n = re.subn(r'(?m)^(\s*agora_rtc_engine\s*:\s*)[^\n#]+', r'\g<1>^6.5.4', s)
          if n == 0:
              raise SystemExit('agora_rtc_engine dependency not found in pubspec.yaml')
          p.write_text(s2)
          print('Pinned agora_rtc_engine to ^6.5.4')
          PY
      - name: Get Flutter packages
        script: |
          cd source/Lymix
          flutter pub get
      - name: Build debug APK
        script: |
          cd source/Lymix
          flutter build apk --debug
    artifacts:
      - source/Lymix/build/**/outputs/apk/**/*.apk
