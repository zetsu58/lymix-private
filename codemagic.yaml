workflows:
  android-debug-apk:
    name: LYMIX Android Debug APK
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Locate and unpack Lymix project
        script: |
          set -e

          echo "Repository files:"
          ls -lah

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Repository root does not contain a ZIP file."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf source
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          echo "Extracted contents:"
          find source -maxdepth 2 -type f | head -50

          if [ ! -f "source/Lymix/pubspec.yaml" ]; then
            echo "ERROR: source/Lymix/pubspec.yaml not found."
            exit 1
          fi

      - name: Check Flutter installation
        script: |
          flutter --version
          dart --version
          java -version

      - name: Repair Android project
        script: |
          set -e
          cd source/Lymix

          flutter create \
            --no-pub \
            --platforms=android \
            --org com.lymix \
            --project-name lymix \
            .

      - name: Fix AGP 9 Flutter compatibility
        script: |
          set -e
          cd source/Lymix

          touch android/gradle.properties

          sed -i.bak '/^android.newDsl=/d' android/gradle.properties || true
          sed -i.bak '/^android.builtInKotlin=/d' android/gradle.properties || true

          echo 'android.newDsl=false' >> android/gradle.properties
          echo 'android.builtInKotlin=false' >> android/gradle.properties

          echo "=== gradle.properties ==="
          cat android/gradle.properties

          grep -q '^android.newDsl=false$' android/gradle.properties
          grep -q '^android.builtInKotlin=false$' android/gradle.properties

      - name: Fix Agora dependency
        script: |
          set -e
          cd source/Lymix

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          s = p.read_text()

          s2, n = re.subn(
              r'(?m)^(\s*agora_rtc_engine\s*:\s*)[^\n#]+',
              r'\g<1>^6.5.4',
              s
          )

          if n:
              p.write_text(s2)
              print("agora_rtc_engine pinned to ^6.5.4")
          else:
              print("agora_rtc_engine not found; leaving pubspec unchanged")
          PY

      - name: Flutter pub get
        script: |
          set -e
          cd source/Lymix
          flutter clean
          flutter pub get

      - name: Analyze critical Dart errors
        script: |
          cd source/Lymix
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build debug APK
        script: |
          set -e
          cd source/Lymix

          echo "=== Final Gradle properties ==="
          cat android/gradle.properties

          echo "=== Flutter doctor ==="
          flutter doctor -v

          flutter build apk --debug --verbose

    artifacts:
      - source/Lymix/build/app/outputs/flutter-apk/*.apk
      - source/Lymix/build/**/outputs/apk/**/*.apk
