workflows:
  android-debug-apk:
    name: LYMIX V21.22 Hardened Android Debug APK
    max_build_duration: 60

    environment:
      flutter: 3.44.7
      java: 17

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches

    scripts:
      - name: Locate and unpack Lymix V21.22 package
        script: |
          set -euo pipefail

          echo "=== Repository root ==="
          ls -lah

          ZIP_FILE="$(find . -maxdepth 1 -type f \
            \( -iname 'LYMIX_V21_22*.zip' -o -iname '*V21_22*.zip' -o -iname '*V21.22*.zip' \) \
            -print | sort | head -n 1)"

          if [ -z "${ZIP_FILE:-}" ]; then
            echo "ERROR: No V21.22 ZIP found in repository root."
            echo "ZIP files currently present:"
            find . -maxdepth 1 -type f -iname '*.zip' -print || true
            exit 1
          fi

          MATCH_COUNT="$(find . -maxdepth 1 -type f \
            \( -iname 'LYMIX_V21_22*.zip' -o -iname '*V21_22*.zip' -o -iname '*V21.22*.zip' \) \
            -print | wc -l | tr -d ' ')"

          if [ "$MATCH_COUNT" -gt 1 ]; then
            echo "ERROR: More than one V21.22 ZIP found."
            find . -maxdepth 1 -type f \
              \( -iname 'LYMIX_V21_22*.zip' -o -iname '*V21_22*.zip' -o -iname '*V21.22*.zip' \) \
              -print
            exit 1
          fi

          echo "Using package: $ZIP_FILE"
          unzip -tq "$ZIP_FILE"

          rm -rf source /tmp/lymix_unpack
          mkdir -p source /tmp/lymix_unpack
          unzip -q "$ZIP_FILE" -d /tmp/lymix_unpack

          PROJECT_PUBSPEC="$(find /tmp/lymix_unpack -type f -name pubspec.yaml \
            -not -path '*/.dart_tool/*' -not -path '*/build/*' | sort | head -n 1)"

          if [ -z "${PROJECT_PUBSPEC:-}" ]; then
            echo "ERROR: pubspec.yaml not found inside V21.22 ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_PUBSPEC")"
          test -f "$PROJECT_DIR/lib/main.dart"

          mkdir -p source/Lymix
          cp -a "$PROJECT_DIR"/. source/Lymix/

          test -f source/Lymix/pubspec.yaml
          test -f source/Lymix/lib/main.dart

          FOUND_VERSION="$(awk '/^version:/ {print $2; exit}' source/Lymix/pubspec.yaml)"
          echo "Detected Lymix version: $FOUND_VERSION"

          if [ "$FOUND_VERSION" != "21.22.0+237" ]; then
            echo "ERROR: Expected version 21.22.0+237 but found $FOUND_VERSION"
            exit 1
          fi

      - name: Verify pinned toolchain
        script: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version
          flutter doctor -v

      - name: Generate Android scaffold for pinned Flutter
        script: |
          set -euo pipefail
          cd source/Lymix

          rm -rf /tmp/lymix_android_backup /tmp/lymix_scaffold
          mkdir -p /tmp/lymix_android_backup

          cp android/app/src/main/AndroidManifest.xml /tmp/lymix_android_backup/AndroidManifest.xml
          cp -R android/app/src/main/res /tmp/lymix_android_backup/res

          # Preserve optional Android project files when present.
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/lymix_android_backup/google-services.json
          fi
          if [ -d android/app/src/main/assets ]; then
            cp -R android/app/src/main/assets /tmp/lymix_android_backup/assets
          fi
          if [ -d android/app/src/main/xml ]; then
            cp -R android/app/src/main/xml /tmp/lymix_android_backup/xml
          fi

          flutter create \
            --no-pub \
            --platforms=android \
            --org com.lymix \
            --project-name lymix \
            /tmp/lymix_scaffold

          rm -rf android
          cp -R /tmp/lymix_scaffold/android ./android

          cp /tmp/lymix_android_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/res
          cp -R /tmp/lymix_android_backup/res android/app/src/main/res

          if [ -f /tmp/lymix_android_backup/google-services.json ]; then
            cp /tmp/lymix_android_backup/google-services.json android/app/google-services.json
          fi
          if [ -d /tmp/lymix_android_backup/assets ]; then
            rm -rf android/app/src/main/assets
            cp -R /tmp/lymix_android_backup/assets android/app/src/main/assets
          fi
          if [ -d /tmp/lymix_android_backup/xml ]; then
            rm -rf android/app/src/main/xml
            cp -R /tmp/lymix_android_backup/xml android/app/src/main/xml
          fi

      - name: Set Lymix Android identity
        script: |
          set -euo pipefail
          cd source/Lymix

          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          build_file = next((p for p in candidates if p.exists()), None)
          if build_file is None:
              raise SystemExit("Android app Gradle file not found")

          s = build_file.read_text()
          s = re.sub(r'namespace\s*=\s*["\'][^"\']+["\']', 'namespace = "com.lymix.app"', s)
          s = re.sub(r'namespace\s+["\'][^"\']+["\']', 'namespace "com.lymix.app"', s)
          s = re.sub(r'applicationId\s*=\s*["\'][^"\']+["\']', 'applicationId = "com.lymix.app"', s)
          s = re.sub(r'applicationId\s+["\'][^"\']+["\']', 'applicationId "com.lymix.app"', s)
          build_file.write_text(s)

          root = Path("android/app/src/main/kotlin")
          if root.exists():
              for f in root.rglob("MainActivity.kt"):
                  f.unlink()

          target = root / "com/lymix/app/MainActivity.kt"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              "package com.lymix.app\n\n"
              "import io.flutter.embedding.android.FlutterActivity\n\n"
              "class MainActivity : FlutterActivity()\n"
          )
          PY

      - name: Resolve and freeze Flutter dependencies
        script: |
          set -euo pipefail
          cd source/Lymix

          echo "=== Direct dependency pins ==="
          grep -E '^  [a-zA-Z0-9_]+:' pubspec.yaml || true

          grep -E '^  agora_rtc_engine: 6\.5\.4$' pubspec.yaml
          grep -E '^  flutter_secure_storage: 9\.2\.2$' pubspec.yaml
          grep -E '^  file_picker: 8\.1\.7$' pubspec.yaml
          grep -E '^  image_picker: 1\.2\.3$' pubspec.yaml
          grep -E '^  http: 1\.6\.0$' pubspec.yaml
          grep -E '^  flutter_face_api: 8\.2\.1021$' pubspec.yaml
          grep -E '^  flutter_face_core_basic: 8\.2\.461$' pubspec.yaml

          flutter pub get
          test -f pubspec.lock

          flutter pub deps --style=compact > dependency-tree.txt
          echo "Dependency resolution successful."

      - name: Normalize all Android plugin compileSdk values
        script: |
          set -euo pipefail
          cd source/Lymix

          PUB_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "Pub cache: $PUB_ROOT"

          python3 - "$PUB_ROOT" <<'PY'
          from pathlib import Path
          import re
          import sys

          pub_root = Path(sys.argv[1])
          patched = []
          inspected = []

          def patch_gradle(path: Path):
              try:
                  text = path.read_text()
              except Exception:
                  return

              if "android" not in text:
                  return

              original = text

              text = re.sub(
                  r'compileSdkVersion\s*=\s*(?:flutter\.compileSdkVersion|\d+)',
                  'compileSdkVersion = 36',
                  text
              )
              text = re.sub(
                  r'compileSdkVersion\s+(?:flutter\.compileSdkVersion|\d+)',
                  'compileSdkVersion 36',
                  text
              )
              text = re.sub(
                  r'compileSdk\s+(?:flutter\.compileSdkVersion|\d+)',
                  'compileSdk 36',
                  text
              )
              text = re.sub(
                  r'compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)',
                  'compileSdk = 36',
                  text
              )
              text = re.sub(
                  r'(?m)^(\s*(?:def\s+)?compileSdkVersion\s*=\s*)\d+\s*$',
                  r'\g<1>36',
                  text
              )
              text = re.sub(
                  r'(?m)^(\s*(?:def\s+)?compileSdk\s*=\s*)\d+\s*$',
                  r'\g<1>36',
                  text
              )

              if text != original:
                  path.write_text(text)
                  patched.append(str(path))

              inspected.append(str(path))

          for hosted in (pub_root / "hosted").glob("*"):
              if not hosted.is_dir():
                  continue
              for package in hosted.iterdir():
                  android = package / "android"
                  if not android.is_dir():
                      continue
                  for name in ("build.gradle", "build.gradle.kts"):
                      p = android / name
                      if p.exists():
                          patch_gradle(p)

          print(f"Inspected Android plugin Gradle files: {len(inspected)}")
          print(f"Patched Android plugin Gradle files: {len(patched)}")
          for p in patched:
              print("PATCHED", p)

          offenders = []
          patterns = [
              re.compile(r'compileSdkVersion\s*=?\s*(\d+)'),
              re.compile(r'compileSdk\s*=?\s*(\d+)'),
          ]

          for raw in inspected:
              p = Path(raw)
              try:
                  text = p.read_text()
              except Exception:
                  continue
              for pat in patterns:
                  for m in pat.finditer(text):
                      try:
                          value = int(m.group(1))
                      except Exception:
                          continue
                      if value < 36:
                          offenders.append((str(p), value, m.group(0)))

          if offenders:
              print("ERROR: Android plugins still pinned below compileSdk 36:")
              for item in offenders:
                  print(item)
              raise SystemExit(1)

          print("All detected hard-coded Android plugin compileSdk values are >= 36.")
          PY

          echo "=== file_picker Gradle after normalization ==="
          FILE_PICKER_DIR="$(find "$PUB_ROOT" -type d -name 'file_picker-8.1.7' -print | head -n 1)"
          if [ -n "${FILE_PICKER_DIR:-}" ]; then
            sed -n '1,180p' "$FILE_PICKER_DIR/android/build.gradle" 2>/dev/null || true
            sed -n '1,180p' "$FILE_PICKER_DIR/android/build.gradle.kts" 2>/dev/null || true
          fi

      - name: Harden Android SDK compatibility
        script: |
          set -euo pipefail
          cd source/Lymix

          python3 - <<'PY'
          from pathlib import Path
          import re

          app_candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          app = next((p for p in app_candidates if p.exists()), None)
          if app is None:
              raise SystemExit("Android app Gradle file not found")

          s = app.read_text()
          s = re.sub(
              r'compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)',
              'compileSdk = 36',
              s,
          )
          s = re.sub(
              r'compileSdkVersion\s+(?:flutter\.compileSdkVersion|\d+)',
              'compileSdkVersion 36',
              s,
          )
          s = re.sub(
              r'compileSdk\s+(?:flutter\.compileSdkVersion|\d+)',
              'compileSdk 36',
              s,
          )
          app.write_text(s)

          root_kts = Path("android/build.gradle.kts")
          root_groovy = Path("android/build.gradle")

          if root_kts.exists():
              text = root_kts.read_text()
              marker = 'extra["compileSdkVersion"] = 36'
              if marker not in text:
                  text = marker + "\n" + text
              root_kts.write_text(text)
              print("Patched root Kotlin DSL:", root_kts)

          elif root_groovy.exists():
              text = root_groovy.read_text()
              marker = "ext.compileSdkVersion = 36"
              if marker not in text:
                  text = marker + "\n" + text
              root_groovy.write_text(text)
              print("Patched root Groovy DSL:", root_groovy)

          else:
              raise SystemExit("Android root Gradle file not found")

          print("=== app Gradle ===")
          print(app.read_text())
          print("=== root Gradle ===")
          if root_kts.exists():
              print(root_kts.read_text())
          else:
              print(root_groovy.read_text())
          PY

      - name: Apply AGP 9 compatibility for Agora
        script: |
          set -euo pipefail
          cd source/Lymix

          PROPS="android/gradle.properties"
          touch "$PROPS"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/gradle.properties")
          existing = p.read_text().splitlines() if p.exists() else []

          managed = {
              "android.uniquePackageNames": "false",
              "android.newDsl": "false",
              "android.builtInKotlin": "false",
          }

          out = []
          seen = set()

          for line in existing:
              stripped = line.strip()
              key = stripped.split("=", 1)[0] if "=" in stripped else None
              if key in managed:
                  if key not in seen:
                      out.append(f"{key}={managed[key]}")
                      seen.add(key)
              else:
                  out.append(line)

          for key, value in managed.items():
              if key not in seen:
                  out.append(f"{key}={value}")

          p.write_text("\n".join(out).rstrip() + "\n")
          print(p.read_text())
          PY

          grep -q '^android.uniquePackageNames=false$' "$PROPS"
          grep -q '^android.newDsl=false$' "$PROPS"
          grep -q '^android.builtInKotlin=false$' "$PROPS"

      - name: Verify Agora Android configuration
        script: |
          set -euo pipefail
          cd source/Lymix

          PUB_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"
          AGORA_DIR="$(find "$PUB_ROOT" -type d -name 'agora_rtc_engine-6.5.4' -print | head -n 1)"

          if [ -z "${AGORA_DIR:-}" ]; then
            echo "ERROR: agora_rtc_engine-6.5.4 not found in Pub cache"
            exit 1
          fi

          echo "=== Agora Android Gradle source ==="
          if [ -f "$AGORA_DIR/android/build.gradle" ]; then
            sed -n '1,220p' "$AGORA_DIR/android/build.gradle"
          elif [ -f "$AGORA_DIR/android/build.gradle.kts" ]; then
            sed -n '1,220p' "$AGORA_DIR/android/build.gradle.kts"
          else
            echo "ERROR: Agora Android Gradle file missing"
            exit 1
          fi

          echo "=== Root compileSdk override ==="
          grep -R -n 'compileSdkVersion.*36\|compileSdk.*36' android/build.gradle* android/app/build.gradle* || true

      - name: Android dependency and manifest preflight
        script: |
          set -euo pipefail
          cd source/Lymix/android
          chmod +x gradlew

          echo "=== App AAR metadata check ==="
          ./gradlew :app:checkDebugAarMetadata --stacktrace

          echo "=== File Picker AAR metadata check ==="
          ./gradlew :file_picker:checkDebugAarMetadata --stacktrace

          echo "=== Manifest merge check ==="
          ./gradlew :app:processDebugMainManifest --stacktrace

          echo "Android dependency and manifest preflight passed."

      - name: Validate V21 product integrity
        script: |
          set -euo pipefail
          cd source/Lymix

          echo "=== Permanent room model ==="
          test -f lib/services/permanent_room_service.dart
          grep -q "class PermanentRoomService" lib/services/permanent_room_service.dart
          grep -q "RoomPkController" lib/screens/room_screen.dart
          grep -q "GiftTargetMode" lib/widgets/gift_send_sheet.dart
          test -f lib/economy/quota_economy.dart
          test -f lib/screens/agency_coin_bank_screen.dart

          echo "=== Block known demo/fake social content ==="
          if grep -R -n -E "LYMIX Creator [0-9]|Kullanıcı [0-9]|Demo \\+100K|Gece Sohbeti Özel|128 katılımcı|316 katılım" lib; then
            echo "ERROR: known demo/fake production content detected"
            exit 1
          fi

          echo "V21 product integrity passed."

      - name: Guard V21.22 analyzer regressions
        script: |
          set -euo pipefail
          cd source/Lymix
          ! grep -R -n "Icons\\.swords" lib
          ! grep -n -E "[0-9]_[0-9]|[0-9]'[0-9]" lib/economy/quota_economy.dart
          grep -q "GiftTier" lib/screens/agency_coin_bank_screen.dart
          ! grep -R -n "Sunucu: http" lib/screens/login_screen.dart || true
          echo "V21.22 regression guards passed."

      - name: Audit navigation and dead actions
        script: |
          set -euo pipefail
          cd source/Lymix
          echo "=== Empty callbacks ==="
          if grep -R -n -E "on(Tap|Pressed|LongPress):[[:space:]]*\\(\\)[[:space:]]*=>?[[:space:]]*\\{[[:space:]]*\\}" lib; then
            echo "ERROR: empty user action callback found"
            exit 1
          fi
          echo "=== Old FeatureHub profile placeholders ==="
          if grep -R -n "FeatureHubScreen(title:.*Favor\\|FeatureHubScreen(title:.*Çanta" lib; then
            echo "ERROR: placeholder navigation remains"
            exit 1
          fi
          test -f lib/screens/user_profile_screen.dart
          test -f lib/screens/direct_message_screen.dart
          test -f lib/screens/favorites_screen.dart
          test -f lib/screens/inventory_screen.dart
          echo "Navigation integrity passed."

      - name: Validate clean-room architecture
        script: |
          set -euo pipefail
          cd source/Lymix
          test -f lib/services/game_provider_adapter.dart
          test -f lib/services/game_session_controller.dart
          test -f lib/services/room_runtime_controller.dart
          test -f lib/services/social_presence_service.dart
          test -f lib/models/game_session.dart
          ! grep -R -n "userId: '101'" lib
          ! grep -R -n -E "3\\.65M|VIP3 • Lv38|128 katılımcı|316 katılım" lib
          grep -q "SessionService.user" lib/screens/game_center_screen.dart
          grep -q "getCatalog" lib/screens/game_center_screen.dart
          echo "Clean-room architecture guards passed."

      - name: Validate premium UI chrome
        script: |
          set -euo pipefail
          cd source/Lymix
          test -f lib/widgets/lymix_live_chrome.dart
          grep -q "class LymixPromoCarousel" lib/widgets/lymix_live_chrome.dart
          grep -q "class LymixSystemTicker" lib/widgets/lymix_live_chrome.dart
          grep -q "class LymixTopTip" lib/widgets/lymix_live_chrome.dart
          grep -q "class LymixFeaturePopup" lib/widgets/lymix_live_chrome.dart
          echo "Premium UI chrome present."

      - name: Validate hybrid admin architecture
        script: |
          set -euo pipefail
          cd source/Lymix
          test -f lib/services/admin_access_service.dart
          test -f lib/screens/admin_hybrid_center_screen.dart
          test -f lib/screens/admin_web_panel_screen.dart
          grep -q "LYMIX_ADMIN_PANEL_URL" lib/screens/admin_web_panel_screen.dart
          grep -q "AdminCapability" lib/services/admin_access_service.dart
          echo "Hybrid admin architecture present."

      - name: Validate hybrid admin web
        script: |
          set -euo pipefail
          cd source/Lymix
          test -f admin_web/index.html
          test -f admin_web/styles.css
          test -f admin_web/app.js
          grep -q "app.use('/admin'" backend/server.js
          grep -q "LYMIX_ADMIN_PANEL_URL" lib/screens/admin_web_panel_screen.dart
          grep -q "LymixAdminBridge.acceptToken" lib/screens/admin_web_panel_screen.dart
          ! grep -q "room_999" backend/server.js
          ! grep -q "i.pravatar.cc" backend/server.js
          echo "Hybrid admin web integration passed."

      - name: Validate creator verification and Regula liveness
        script: |
          set -euo pipefail
          cd source/Lymix
          test -f lib/screens/creator_verification_screen.dart
          test -f lib/services/creator_verification_service.dart
          test -f lib/services/face_liveness_service.dart
          test -f backend/routes/creatorVerificationRoutes.js
          test -f backend/services/creatorVerificationService.js
          grep -q "image_picker: 1.2.3" pubspec.yaml
          grep -q "flutter_face_api: 8.2.1021" pubspec.yaml
          grep -q "flutter_face_core_basic: 8.2.461" pubspec.yaml
          grep -q "FaceSDK.instance.startLiveness" lib/services/face_liveness_service.dart
          grep -q "LivenessStatus.PASSED" lib/services/face_liveness_service.dart
          grep -q "/api/creator-verification" backend/server.js
          grep -q "creator-verifications" admin_web/app.js
          node --check backend/server.js
          node --check backend/routes/creatorVerificationRoutes.js
          node --check backend/services/creatorVerificationService.js
          node --check admin_web/app.js
          echo "Creator verification + Regula liveness integration passed."

      - name: Validate V21.22 account security and auth
        script: |
          set -euo pipefail
          cd source/Lymix
          grep -q '^version: 21.22.0+237$' pubspec.yaml
          test -f lib/screens/account_security_screen.dart
          test -f backend/routes/securityRoutes.js
          test -f backend/services/phoneVerificationService.js
          grep -q "/api/security" backend/server.js
          grep -q 'TWILIO_VERIFY_SERVICE_SID' backend/services/phoneVerificationService.js
          node --check backend/server.js
          node --check backend/routes/securityRoutes.js
          node --check backend/services/phoneVerificationService.js
          echo "V21.22 account security integration passed."

      - name: Validate backend and admin JavaScript syntax
        script: |
          set -euo pipefail
          cd source/Lymix
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find backend admin_web -type f -name '*.js' -print0)
          echo "Backend/admin JavaScript syntax passed."

      - name: Validate Dart compile surface
        script: |
          set -euo pipefail
          cd source/Lymix

          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyzer-output.txt
          ANALYZE_EXIT=${PIPESTATUS[0]}
          set -e

          echo "Analyzer exit code: $ANALYZE_EXIT"

          if grep -E '^[[:space:]]*error[[:space:]]+•' analyzer-output.txt >/dev/null; then
            echo "Real analyzer errors found:"
            grep -E '^[[:space:]]*error[[:space:]]+•' analyzer-output.txt
            exit 1
          fi

          echo "No Dart analyzer errors."

      - name: Compile tests
        script: |
          set -euo pipefail
          cd source/Lymix

          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test --no-pub --reporter expanded 2>&1 | tee test-output.txt
          else
            echo "No tests found." | tee test-output.txt
          fi

      - name: Verify Android manifest and resources
        script: |
          set -euo pipefail
          cd source/Lymix

          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -f "android/app/src/main/res/mipmap-$d/ic_launcher.png"
          done

          echo "Manifest and launcher resources verified."

      - name: Warm Gradle with retry
        script: |
          set -euo pipefail
          cd source/Lymix/android
          chmod +x gradlew

          for attempt in 1 2 3 4; do
            echo "Gradle attempt $attempt/4"
            if ./gradlew --version; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            rm -rf "$HOME/.gradle/wrapper/dists"/*
            sleep 10
          done

      - name: Build debug APK
        script: |
          set -euo pipefail
          cd source/Lymix

          flutter build apk --debug --no-pub

          test -s build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk \
             build/app/outputs/flutter-apk/LYMIX-V21.22-HARDENED-DEBUG.apk
          ls -lh build/app/outputs/flutter-apk/*.apk

