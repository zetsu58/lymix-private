workflows:
  android-debug-apk:
    name: LYMIX Android Debug APK
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Locate and unpack Lymix project
        script: |
          set -euo pipefail

          ZIP_FILE="./LYMIX_V20_2_FINAL_COMPILE_FIX_BUILD_READY.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 1 -type f -name "LYMIX_V20_2*.zip" | head -n 1)
          fi

          if [ -z "${ZIP_FILE:-}" ]; then
            echo "ERROR: ZIP file not found in repository root."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          rm -rf source
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          test -f source/Lymix/pubspec.yaml
          test -f source/Lymix/lib/main.dart

      - name: Generate Android scaffold for installed Flutter
        script: |
          set -euo pipefail
          cd source/Lymix

          # Keep Lymix-specific Android resources before replacing the old scaffold.
          rm -rf /tmp/lymix_android_backup /tmp/lymix_scaffold
          mkdir -p /tmp/lymix_android_backup

          cp android/app/src/main/AndroidManifest.xml /tmp/lymix_android_backup/AndroidManifest.xml
          cp -R android/app/src/main/res /tmp/lymix_android_backup/res

          flutter create \
            --no-pub \
            --platforms=android \
            --org com.lymix \
            --project-name lymix \
            /tmp/lymix_scaffold

          rm -rf android
          cp -R /tmp/lymix_scaffold/android ./android

          # Restore app permissions, label and Lymix launcher resources.
          cp /tmp/lymix_android_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/res
          cp -R /tmp/lymix_android_backup/res android/app/src/main/res

      - name: Set Lymix Android identity
        script: |
          set -euo pipefail
          cd source/Lymix

          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]
          build_file = next((p for p in candidates if p.exists()), None)
          if build_file is None:
              raise SystemExit("Android app Gradle file not found")

          s = build_file.read_text()

          # Groovy and Kotlin DSL forms.
          s = re.sub(r'namespace\s*=\s*["\'][^"\']+["\']', 'namespace = "com.lymix.app"', s)
          s = re.sub(r'namespace\s+["\'][^"\']+["\']', 'namespace "com.lymix.app"', s)
          s = re.sub(r'applicationId\s*=\s*["\'][^"\']+["\']', 'applicationId = "com.lymix.app"', s)
          s = re.sub(r'applicationId\s+["\'][^"\']+["\']', 'applicationId "com.lymix.app"', s)
          build_file.write_text(s)

          kotlin_root = Path("android/app/src/main/kotlin")
          if kotlin_root.exists():
              for f in kotlin_root.rglob("MainActivity.kt"):
                  f.unlink()

          target = kotlin_root / "com/lymix/app/MainActivity.kt"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              "package com.lymix.app\n\n"
              "import io.flutter.embedding.android.FlutterActivity\n\n"
              "class MainActivity : FlutterActivity()\n"
          )

          print(f"Using Android build file: {build_file}")
          print(build_file.read_text())
          PY

      - name: Normalize Flutter dependencies
        script: |
          set -euo pipefail
          cd source/Lymix

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("pubspec.yaml")
          s = p.read_text()
          s2, n = re.subn(
              r'(?m)^(\s*agora_rtc_engine\s*:\s*)[^\n#]+',
              r'\g<1>^6.5.4',
              s,
          )
          if n:
              p.write_text(s2)
              print("agora_rtc_engine pinned to ^6.5.4")
          else:
              print("Agora dependency not present; no change needed")
          PY

      - name: Get Flutter packages
        script: |
          set -euo pipefail
          cd source/Lymix
          flutter clean
          flutter pub get

      - name: Validate project before build
        script: |
          set -euo pipefail
          cd source/Lymix

          echo "=== Flutter ==="
          flutter --version
          echo "=== Java ==="
          java -version
          echo "=== Android build files ==="
          find android -maxdepth 3 -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle-wrapper.properties" \) -print

          # Analyzer must not hide compile errors. Warnings/info do not fail the build.
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Warm Gradle with retry
        script: |
          set -euo pipefail
          cd source/Lymix/android
          chmod +x gradlew

          for attempt in 1 2 3 4; do
            echo "Gradle attempt $attempt/4"
            if ./gradlew --version; then
              exit 0
            fi

            if [ "$attempt" -eq 4 ]; then
              echo "ERROR: Gradle could not be prepared after 4 attempts."
              exit 1
            fi

            rm -rf "$HOME/.gradle/wrapper/dists"/*
            sleep 10
          done

      - name: Build debug APK
        script: |
          set -euo pipefail
          cd source/Lymix
          flutter build apk --debug

    artifacts:
      - source/Lymix/build/app/outputs/flutter-apk/*.apk
      - source/Lymix/build/**/outputs/apk/**/*.apk
