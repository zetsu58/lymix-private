workflows:
  android-debug-apk:
    name: LYMIX V21.22.1 Hardened Android Debug APK + Source Export
    max_build_duration: 60

    environment:
      flutter: 3.44.7
      java: 17

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches

    scripts:
      - name: Locate and unpack Lymix source
        script: |
          set -euo pipefail
          rm -rf source extracted artifacts
          mkdir -p extracted source/Lymix artifacts

          SOURCE_ZIP="$(find . -maxdepth 1 -type f \
            \( -iname 'LYMIX_V21_22_BUILD_FIXES_CODEMAGIC_HARDENED.zip' \
               -o -iname 'LYMIX_V21_22_1_ANALYZER_FIX_CODEMAGIC_READY.zip' \
               -o -iname '*ANALYZER_FIX_CODEMAGIC_READY*.zip' \
               -o -iname '*BUILD_FIXES_CODEMAGIC_HARDENED*.zip' \) \
            -print | sort | head -n 1)"

          if [ -z "${SOURCE_ZIP:-}" ]; then
            BUNDLE_ZIP="$(find . -maxdepth 1 -type f \
              \( -iname 'LYMIX_V21_22_1_CODEMAGIC_GITHUB_BUNDLE.zip' \
                 -o -iname '*CODEMAGIC_GITHUB_BUNDLE*.zip' \) \
              -print | sort | head -n 1)"
            test -n "${BUNDLE_ZIP:-}"
            unzip -tq "$BUNDLE_ZIP"
            mkdir -p extracted/bundle
            unzip -q "$BUNDLE_ZIP" -d extracted/bundle
            SOURCE_ZIP="$(find extracted/bundle -type f -iname '*.zip' ! -iname '*CODEMAGIC_GITHUB_BUNDLE*.zip' -print | sort | head -n 1)"
          fi

          test -n "${SOURCE_ZIP:-}"
          unzip -tq "$SOURCE_ZIP"
          mkdir -p extracted/source_zip
          unzip -q "$SOURCE_ZIP" -d extracted/source_zip

          PUBSPEC="$(find extracted/source_zip -type f -name pubspec.yaml \
            -exec sh -c 'test -f "$(dirname "$1")/lib/main.dart" && printf "%s\n" "$1"' _ {} \; | head -n 1)"
          test -n "${PUBSPEC:-}"
          PROJECT="$(dirname "$PUBSPEC")"
          cp -a "$PROJECT"/. source/Lymix/

          test -f source/Lymix/pubspec.yaml
          test -f source/Lymix/lib/main.dart
          FOUND_VERSION="$(awk '/^version:/ {print $2; exit}' source/Lymix/pubspec.yaml)"
          echo "Detected Lymix version: $FOUND_VERSION"
          test "$FOUND_VERSION" = "21.22.0+237"

      - name: Apply full mobile audit fixes
        script: |
          set -euo pipefail
          python3 scripts/apply_full_mobile_audit_fixes.py source/Lymix
          test -f source/Lymix/lib/screens/room_screen.dart
          test -f source/Lymix/lib/screens/home_screen.dart
          test -f source/Lymix/lib/screens/game_center_screen.dart
          if grep -R -nE "on(Tap|Pressed):[[:space:]]*\(\)[[:space:]]*\{[[:space:]]*\}" source/Lymix/lib; then
            echo 'Dead empty UI callback detected after audit patch.'
            exit 1
          fi
          grep -n "onTap: () => _seatTap(i)" source/Lymix/lib/screens/room_screen.dart
          grep -n "onLongPress:" source/Lymix/lib/screens/room_screen.dart | head -n 5

      - name: Export patched Flutter source snapshot
        script: |
          set -euo pipefail
          cd source/Lymix
          rm -rf .dart_tool build
          zip -qr ../../artifacts/LYMIX_V21_22_1_EXTRACTED_FLUTTER_SOURCE.zip . \
            -x '.git/*' '.dart_tool/*' 'build/*' '*.apk' '*.aab'
          cd ../..
          test -s artifacts/LYMIX_V21_22_1_EXTRACTED_FLUTTER_SOURCE.zip
          unzip -tq artifacts/LYMIX_V21_22_1_EXTRACTED_FLUTTER_SOURCE.zip
          ls -lh artifacts/LYMIX_V21_22_1_EXTRACTED_FLUTTER_SOURCE.zip

      - name: Verify pinned toolchain
        script: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version
          flutter doctor -v

      - name: Generate Android scaffold for pinned Flutter
        script: |
          set -euo pipefail
          cd source/Lymix
          rm -rf /tmp/lymix_android_backup /tmp/lymix_scaffold
          mkdir -p /tmp/lymix_android_backup
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/lymix_android_backup/AndroidManifest.xml
          fi
          if [ -d android/app/src/main/res ]; then
            cp -R android/app/src/main/res /tmp/lymix_android_backup/res
          fi
          flutter create --no-pub --platforms=android --org com.lymix --project-name lymix /tmp/lymix_scaffold
          rm -rf android
          cp -R /tmp/lymix_scaffold/android ./android
          if [ -f /tmp/lymix_android_backup/AndroidManifest.xml ]; then
            cp /tmp/lymix_android_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          if [ -d /tmp/lymix_android_backup/res ]; then
            rm -rf android/app/src/main/res
            cp -R /tmp/lymix_android_backup/res android/app/src/main/res
          fi

      - name: Set Android identity and SDK level
        script: |
          set -euo pipefail
          cd source/Lymix
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = next((p for p in [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')] if p.exists()), None)
          if app is None:
              raise SystemExit('Android app Gradle file not found')
          s = app.read_text()
          s = re.sub(r'namespace\s*=\s*["\'][^"\']+["\']', 'namespace = "com.lymix.app"', s)
          s = re.sub(r'namespace\s+["\'][^"\']+["\']', 'namespace "com.lymix.app"', s)
          s = re.sub(r'applicationId\s*=\s*["\'][^"\']+["\']', 'applicationId = "com.lymix.app"', s)
          s = re.sub(r'applicationId\s+["\'][^"\']+["\']', 'applicationId "com.lymix.app"', s)
          s = re.sub(r'compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)', 'compileSdk = 36', s)
          s = re.sub(r'compileSdkVersion\s+(?:flutter\.compileSdkVersion|\d+)', 'compileSdkVersion 36', s)
          app.write_text(s)

          root = Path('android/app/src/main/kotlin')
          if root.exists():
              for f in root.rglob('MainActivity.kt'):
                  f.unlink()
          target = root / 'com/lymix/app/MainActivity.kt'
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text('package com.lymix.app\n\nimport io.flutter.embedding.android.FlutterActivity\n\nclass MainActivity : FlutterActivity()\n')

          props = Path('android/gradle.properties')
          lines = props.read_text().splitlines() if props.exists() else []
          managed = {
              'android.uniquePackageNames': 'false',
              'android.newDsl': 'false',
              'android.builtInKotlin': 'false',
          }
          out = [line for line in lines if not any(line.strip().startswith(k + '=') for k in managed)]
          out += [f'{k}={v}' for k, v in managed.items()]
          props.write_text('\n'.join(out).rstrip() + '\n')
          PY

      - name: Resolve Flutter dependencies
        script: |
          set -euo pipefail
          cd source/Lymix
          grep -E '^  agora_rtc_engine: 6\.5\.4$' pubspec.yaml
          flutter pub get
          test -f pubspec.lock
          flutter pub deps --style=compact > dependency-tree.txt

      - name: Force Android libraries to compileSdk 36
        script: |
          set -euo pipefail
          cd source/Lymix
          PUB_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"
          AGORA_LIST="${TMPDIR:-/tmp}/lymix_agora_gradle_files.txt"
          rm -f "$AGORA_LIST"

          echo '=== Locate Agora Android Gradle files ==='
          find "$PUB_ROOT" -type f \
            \( -path '*agora_rtc_engine*/android/build.gradle' -o -path '*agora_rtc_engine*/android/build.gradle.kts' \) \
            -print > "$AGORA_LIST"

          if [ ! -s "$AGORA_LIST" ]; then
            echo 'ERROR: agora_rtc_engine Android Gradle file was not found.'
            find "$PUB_ROOT" -maxdepth 5 -type d -iname '*agora*' -print || true
            exit 1
          fi

          cat "$AGORA_LIST"

          python3 - "$PUB_ROOT" <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])
          candidates = [p for p in root.rglob('build.gradle*') if 'agora_rtc_engine' in str(p) and '/android/' in str(p).replace('\\', '/')]
          if not candidates:
              raise SystemExit('Agora Gradle file not found')

          patterns = [
              (r"compileSdkVersion\s+safeExtGet\(\s*['\"]compileSdkVersion['\"]\s*,\s*\d+\s*\)", 'compileSdkVersion 36'),
              (r'compileSdkVersion\s*=\s*(?:flutter\.compileSdkVersion|\d+)', 'compileSdkVersion = 36'),
              (r'compileSdkVersion\s+(?:flutter\.compileSdkVersion|\d+)', 'compileSdkVersion 36'),
              (r'compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)', 'compileSdk = 36'),
              (r'compileSdk\s+(?:flutter\.compileSdkVersion|\d+)', 'compileSdk 36'),
          ]

          for path in candidates:
              text = path.read_text()
              original = text
              for pattern, replacement in patterns:
                  text = re.sub(pattern, replacement, text)
              if text != original:
                  path.write_text(text)
              print(f'AGORA_FILE={path}')
              for line in text.splitlines():
                  if 'compileSdk' in line:
                      print(f'  {line.strip()}')
              bad = [line.strip() for line in text.splitlines() if 'compileSdk' in line and re.search(r'\b31\b', line)]
              if bad:
                  raise SystemExit(f'Agora compileSdk 31 still present in {path}: {bad}')

          for path in root.rglob('build.gradle*'):
              normalized = str(path).replace('\\', '/')
              if '/android/' not in normalized:
                  continue
              try:
                  text = path.read_text()
              except Exception:
                  continue
              original = text
              for pattern, replacement in patterns:
                  text = re.sub(pattern, replacement, text)
              if text != original:
                  path.write_text(text)
          PY

          echo '=== Install Gradle global compileSdk override ==='
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/lymix-compile-sdk.gradle" <<'GRADLE'
          allprojects { p ->
              p.plugins.withId('com.android.application') {
                  if (p.hasProperty('android')) {
                      p.android.compileSdkVersion 36
                  }
              }
              p.plugins.withId('com.android.library') {
                  if (p.hasProperty('android')) {
                      p.android.compileSdkVersion 36
                  }
              }
          }
          GRADLE
          cat "$HOME/.gradle/init.d/lymix-compile-sdk.gradle"

          echo '=== Verify Agora effective Gradle source ==='
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            grep -nE 'compileSdk|compileSdkVersion' "$f" || true
            if grep -E 'compileSdk|compileSdkVersion' "$f" | grep -Eq '(^|[^0-9])31([^0-9]|$)'; then
              echo "ERROR: a compileSdk line still references 31 in $f"
              exit 1
            fi
          done < "$AGORA_LIST"

      - name: Validate product integrity
        script: |
          set -euo pipefail
          cd source/Lymix
          test -f lib/services/permanent_room_service.dart
          test -f lib/screens/creator_verification_screen.dart
          test -f lib/services/creator_verification_service.dart
          test -f lib/services/admin_access_service.dart
          test -f lib/screens/admin_hybrid_center_screen.dart
          test -f lib/screens/admin_web_panel_screen.dart
          if grep -R -n 'Icons\.verified_face_rounded' lib; then
            echo 'Analyzer regression detected.'
            exit 1
          fi

      - name: Validate Dart compile surface
        script: |
          set -euo pipefail
          cd source/Lymix
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyzer-output.txt
          ANALYZE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "Analyzer exit code: $ANALYZE_EXIT"
          if grep -E '^[[:space:]]*error[[:space:]]+•' analyzer-output.txt >/dev/null; then
            grep -E '^[[:space:]]*error[[:space:]]+•' analyzer-output.txt
            exit 1
          fi

      - name: Compile tests
        script: |
          set -euo pipefail
          cd source/Lymix
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test --no-pub --reporter expanded 2>&1 | tee test-output.txt
          else
            echo 'No tests found.' | tee test-output.txt
          fi

      - name: Ensure Android permissions
        script: |
          set -euo pipefail
          cd source/Lymix
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          pos = s.find('>', s.find('<manifest'))
          if pos < 0:
              raise SystemExit('Invalid AndroidManifest.xml')
          s = s[:pos+1] + '\n    <uses-permission android:name="android.permission.CAMERA"/>' + s[pos+1:]
          p.write_text(s)
          PY
          fi
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml

      - name: Android Gradle preflight
        script: |
          set -euo pipefail
          cd source/Lymix/android
          chmod +x gradlew
          ./gradlew :app:checkDebugAarMetadata --stacktrace
          ./gradlew :app:processDebugMainManifest --stacktrace

      - name: Warm Gradle with retry
        script: |
          set -euo pipefail
          cd source/Lymix/android
          chmod +x gradlew
          for attempt in 1 2 3 4; do
            echo "Gradle attempt $attempt/4"
            if ./gradlew --version; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            rm -rf "$HOME/.gradle/wrapper/dists"/*
            sleep 10
          done

      - name: Build debug APK
        script: |
          set -euo pipefail
          cd source/Lymix
          flutter build apk --debug --no-pub
          test -s build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

    artifacts:
      - artifacts/LYMIX_V21_22_1_EXTRACTED_FLUTTER_SOURCE.zip
      - source/Lymix/build/app/outputs/flutter-apk/*.apk
      - source/Lymix/analyzer-output.txt
      - source/Lymix/test-output.txt
      - source/Lymix/dependency-tree.txt
      - source/Lymix/pubspec.lock
