name: LYMIX Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Unpack LYMIX project
        run: |
          mkdir -p source
          unzip -q Lymix_V8_16_GITHUB_UPLOAD_LITE.zip -d source

      - name: Complete Android scaffold
        working-directory: source/Lymix
        run: flutter create --platforms=android --org com.lymix --project-name lymix .

      - name: Get packages
        working-directory: source/Lymix
        run: flutter pub get

      - name: Build debug APK
        working-directory: source/Lymix
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LYMIX-V8.16-debug-apk
          path: source/Lymix/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
