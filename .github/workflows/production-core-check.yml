name: Lymix Production Core Check

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/production-core-check.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lymix
          POSTGRES_DB: lymix_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lymix -d lymix_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://lymix@localhost:5432/lymix_test?schema=public
      JWT_SECRET: test_jwt_secret_at_least_32_characters_long_123
      OTP_PEPPER: test_otp_pepper_at_least_16_chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma db push
      - name: Node syntax check
        run: |
          node --check bootstrap.js
          node --check admin_bootstrap.js
          node --check start_emergent.js
          node --check server.js
          node --check sud_auth_adapter.js
          node --check sud_server_api.js
          find src scripts test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Unit tests
        run: npm run test:unit
